name: transfer test 1 - list the Texas transfer reports

# Manual-only. Runs src/transfer sources.py, step 1 of "transfer test
# protocol.md": lists the pages, links and report files the Texas Higher
# Education Coordinating Board's sites serve for the transfer test, without
# opening any report (no outcome is read), and commits the listing to
# data/transfer test/sources.json.
on:
  workflow_dispatch:

concurrency:
  group: transfer-test
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - name: List the Texas transfer reports
        run: |
          cd src
          python "transfer sources.py"

      - name: Commit the listing
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/transfer test/"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "transfer test 1: listing of the Texas transfer reports (no outcome read)"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

name: v3 phase 4 - comparator

# Manual-only. Runs src/v3_comparator.py under "sampling protocol v3.md",
# phase 4: the critical-slowing-down comparator for every scored v3 test
# institution, from fiscal years 2009-2019 only, committed before any test
# outcome is looked up. Commits data/v3/comparator flags.json.
on:
  workflow_dispatch:

concurrency:
  group: v3-comparator
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - name: Build the compact College Scorecard file (checked against the protocol's SHA-256)
        run: |
          cd src
          python build_scorecard_compact.py --out ../work/scorecard_compact.csv

      - name: Run the comparator
        run: |
          cd src
          python v3_comparator.py --compact ../work/scorecard_compact.csv --finance ../work/finance

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/v3/comparator flags.json"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "v3 phase 4: comparator flags (no test outcome looked up)"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

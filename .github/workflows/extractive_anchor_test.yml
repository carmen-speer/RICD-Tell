name: item 16 - extractive anchor predictions on for-profit chains (exploratory)

# Manual-only. Runs "src/extractive anchor test.py": checks the four
# extractive-anchor predictions (early protection, clustered closures,
# crossing closure curves, falling instruction share) on every for-profit
# institution active in HD2009, chain campuses against independents, using
# the header files 2009 onward and the for-profit finance files. Exploratory
# (outcomes known). Commits data/v3 exploratory/"extractive anchor test.json".
on:
  workflow_dispatch:

concurrency:
  group: extractive-anchor-test
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: |
          pip install -r "requirements v2 lock.txt"
          pip install xlrd==2.0.1

      - name: Run the extractive-anchor checks
        run: |
          cd src
          python "extractive anchor test.py"

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/v3 exploratory/"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "item 16: extractive anchor predictions on for-profit chains (exploratory)"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

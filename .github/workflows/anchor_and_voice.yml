name: item 15b - anchor and voice cases

# Manual-only. Runs "src/anchor and voice.py" under "anchor and voice
# protocol.md" (Amendments 1 to 4): builds the case list from
# data/anchor and voice/ (tracker entries and reversal cases), matches each
# case to IPEDS by name, measures each with the frozen item-15 rule
# (src/ending types.py, imported unchanged), checks mergers for distress,
# reads onset and anchoring at onset against the sector medians, and draws
# two matched closures per eligible case (seed 20261121). Reads no outcome
# or voice record. Commits data/anchor and voice/.
on:
  workflow_dispatch:

concurrency:
  group: anchor-and-voice
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: |
          pip install -r "requirements v2 lock.txt"
          pip install xlrd==2.0.1

      - name: Measure the anchor-and-voice cases
        run: |
          cd src
          python "anchor and voice.py"

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/anchor and voice/"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "item 15b: anchor-and-voice cases measured (exploratory; no outcome or voice read)"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

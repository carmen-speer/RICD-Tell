name: v2 - cross-machine reproducibility check

# Manual-only. Runs src/check_v2_reproducibility.py under "sampling
# protocol v2.md", third amendment: two separate jobs, on two separate
# machines, fit the same 10 institutions under the amendment's settings,
# and a third job checks that they agree exactly. Commits
# data/v2/reproducibility check.json. No outcome is looked up.
on:
  workflow_dispatch:

concurrency:
  group: v2-reproducibility
  cancel-in-progress: false

permissions:
  contents: write

env:
  NUMBA_CPU_NAME: generic
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  replica:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        name: [a, b]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - name: Build the compact College Scorecard file (checked against the protocol's SHA-256)
        run: |
          cd src
          python build_scorecard_compact.py --out ../work/scorecard_compact.csv

      - name: Fit the 10 institutions
        run: |
          cd src
          python check_v2_reproducibility.py replica --name ${{ matrix.name }} --compact ../work/scorecard_compact.csv --finance ../work/finance --out ../work/replicas

      - uses: actions/upload-artifact@v4
        with:
          name: replica-${{ matrix.name }}
          path: work/replicas/replica_${{ matrix.name }}.json

  compare:
    needs: replica
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - uses: actions/download-artifact@v4
        with:
          path: work/replicas
          merge-multiple: true

      - name: Compare the two machines
        run: |
          cd src
          python check_v2_reproducibility.py compare --dir ../work/replicas

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/v2/reproducibility check.json"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "v2: cross-machine reproducibility check (no outcome looked up)"
            git fetch origin main
            git rebase origin/main
            git push
          fi

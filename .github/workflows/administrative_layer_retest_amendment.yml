name: meta channel 3a - amended joint reading on the held-out colleges

# Manual-only. Runs src/administrative layer retest amendment.py under
# Amendment 1 of "administrative layer retest protocol.md" (disclosed, fixed
# after the run): the joint reading with each sector split at its own median
# debt trend. Reads only committed files; commits
# data/meta channel/administrative layer retest amendment.json.
on:
  workflow_dispatch:

concurrency:
  group: administrative-layer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - name: Run the amended joint reading
        run: |
          cd src
          python "administrative layer retest amendment.py"

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/meta channel/"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "meta channel 3a: amended joint reading (disclosed amendment)"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

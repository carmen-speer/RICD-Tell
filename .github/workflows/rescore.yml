name: Weekly check for a new federal finance year

# Replaces the retired v1 weekly re-score (tracker v1's 15-college live
# table now lives on record at docs/v1.html). Under "live tracker
# protocol.md", section 4, the live v3 scores are redone once a year, when
# NCES releases a new finance year. Each Monday this checks whether the
# finance files for the fiscal year after the live window (fiscal 2025:
# F2425) are served yet, re-bakes the dashboard's static rows from the
# committed scores, and, when the new year is out, fails with a plain
# message so GitHub notifies the maintainer that the live window can move
# forward. Most weeks the new year is not out, which is the normal result.
on:
  schedule:
    - cron: "0 13 * * 1"  # Every Monday, 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Re-bake the dashboard's static rows from the committed scores
        run: |
          cd src
          python render_dashboard.py

      - name: Commit the dashboard, if it changed
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "Dashboard unchanged."
          else
            git commit -m "Weekly: re-bake dashboard rows from the live v3 scores"
            git fetch origin main && git rebase origin/main && git push
          fi

      - name: Check whether fiscal 2025 finance files are served
        run: |
          found=""
          for form in F1A F2 F3; do
            for base in https://nces.ed.gov/ipeds/datacenter/data https://nces.ed.gov/ipeds/complete-data-files; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -I "$base/F2425_${form}.zip" || echo 000)
              echo "F2425_${form} at $base: HTTP $code"
              if [ "$code" = "200" ]; then found="$found F2425_${form}"; fi
            done
          done
          if [ -n "$found" ]; then
            echo "::error::A new federal finance year (fiscal 2025) is served:$found. The live window can move to fiscal 2015-2025 and the live v3 scores be redone (live tracker protocol.md, section 4)."
            exit 1
          fi
          echo "Fiscal 2025 finance files are not served yet; nothing to do."

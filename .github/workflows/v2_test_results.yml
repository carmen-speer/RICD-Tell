name: v2 phase 8 - test outcomes and results

# Manual-only. Runs src/v2_test_results.py under "sampling protocol v2.md",
# phase 8: codes every test institution's outcome from the IPEDS header
# files for 2019 onward, then computes the pre-specified measures, the
# revision triggers R1-R4 and the pass criterion. Refuses to run until
# every test score and the comparator flags are committed. Commits
# data/v2/test outcomes.json and data/v2/test results.json.
on:
  workflow_dispatch:

concurrency:
  group: v2-test-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - name: Run
        run: |
          cd src
          python v2_test_results.py

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/v2/test outcomes.json" "data/v2/test results.json"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "v2 phase 8: test outcomes and results"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

name: paper 1 - count openings against closures from the IPEDS header files

# Manual-only. Runs src/openings and closures.py: downloads every IPEDS
# header file from HD2004 to the latest NCES serves, and counts, year by
# year, new institutions opening against institutions closing or merging,
# by sector (public, private nonprofit, for-profit; four-year and two-year)
# and by size, with liberal arts colleges as their own group. Descriptive,
# for Paper 1: the outcomes are public, nothing is fitted and no verdict is
# drawn. Commits the result to data/openings and closures/results.json.
on:
  workflow_dispatch:

concurrency:
  group: openings-closures
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - name: Download the header files and count openings against closures
        run: |
          cd src
          python "openings and closures.py" --first 2004

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/openings and closures/"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "paper 1: openings against closures from the IPEDS header files (descriptive)"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

name: v2 phase 0 - cold-cache equivalence check

# Manual-only. Runs src/check_v2_equivalence_cold.py under "sampling
# protocol v2.md", phase 0, second amendment: the controlled comparison
# again, but with every fit starting from its own empty compile cache and
# with the order of the old and changed pipelines alternating. Commits
# data/v2/equivalence cold.json. No outcome is looked up.
on:
  workflow_dispatch:

concurrency:
  group: v2-equivalence-cold
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the compact College Scorecard file (checked against the protocol's SHA-256)
        run: |
          cd src
          python build_scorecard_compact.py --out ../work/scorecard_compact.csv

      - name: Run the cold-cache equivalence check
        run: |
          cd src
          python check_v2_equivalence_cold.py --compact ../work/scorecard_compact.csv --finance ../work/finance

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/v2/equivalence cold.json"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "v2 phase 0: cold-cache equivalence check (no outcome looked up)"
            git fetch origin main
            git rebase origin/main
            git push
          fi

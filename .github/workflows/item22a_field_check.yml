name: item 22a step 0 - check the IPEDS completions fields

on:
  workflow_dispatch:

concurrency:
  group: item22a-field-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: |
          pip install -r "requirements v2 lock.txt"
          pip install xlrd==2.0.1

      - name: Check the completions data dictionaries
        run: |
          cd src
          python "item 22a field check.py" --first 2008 --last 2024

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/item 22a/"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "item 22a step 0: field check of the IPEDS completions dictionaries (no data, no outcome)"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

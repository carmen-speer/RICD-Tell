name: v4 gap values - compute the price, outcome and four-year gaps

# Manual-only. Runs "src/v4 gap values.py" under "channel selection
# protocol.md": computes the three IPEDS claim gaps for every institution
# and year, and as of the 2014 and 2019 scoring years, from the inputs and
# frozen calibrations that step 1 committed. Downloads nothing and reads no
# closure outcome. Commits data/v4 channels/"gap values by year.csv",
# "gap values at scoring years.csv" and "gap values summary.json".
on:
  workflow_dispatch:

concurrency:
  group: v4-gap-values
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - name: Compute the gap values
        run: |
          cd src
          python "v4 gap values.py"

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/v4 channels/"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "v4: gap values for every institution and year, and at the 2014 and 2019 scoring years (no closure outcome read)"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

name: meta channel 2 - measure the administrative layer and test it on the development colleges

# Manual-only. Runs src/administrative layer.py: from the same IPEDS
# staffing files (EAP, fall 2012 on) and their data dictionaries, measures
# each institution's administrative layer (management, business and
# financial operations, and community, legal, arts and media staff; and a
# broader version adding office support and student affairs) as a share
# of administrative plus instructional staff, and checks the measurement.
# Then runs src/administrative layer test.py, the exploratory test of the
# hypothesis that a thinner administrative layer goes with less resource
# debt, less closure and stronger operations, on the 670 development
# institutions only (the v3 test institutions are held back for the
# prospective retest). Commits the results to data/meta channel/. No
# frozen file or scoring pipeline uses them.
on:
  workflow_dispatch:

concurrency:
  group: administrative-layer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - name: Download, measure and check the administrative layer
        run: |
          cd src
          python "administrative layer.py" --first 2012

      - name: Test the hypothesis on the development institutions
        run: |
          cd src
          python "administrative layer test.py"

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/meta channel/"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "meta channel 2: administrative layer, its checks and the development test (exploratory)"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

name: reanalysis 2 - refit, rescore the test list and results

# Manual-only. Runs src/reanalysis.py under "reanalysis protocol.md"
# (exploratory), after "reanalysis 1 - rescore with the two-channel model"
# has a result for every institution. In one job: refits classifier v3,
# the size-and-sector baseline and the anchor sensor by their frozen
# procedure on the two-channel development results; applies them to the
# two-channel results of the v3 test institutions; and recomputes the v3
# measures, triggers, second verdict and anchor tests. Commits everything
# to data/v3 reanalysis/. The v3 test outcomes were already known, so no
# result here is a test, and no v3 verdict changes.
on:
  workflow_dispatch:

concurrency:
  group: reanalysis-finish
  cancel-in-progress: false

permissions:
  contents: write

env:
  NUMBA_CPU_NAME: generic
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - name: Set the commit identity
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"

      - name: Build the compact College Scorecard file (checked against the protocol's SHA-256)
        run: |
          cd src
          python build_scorecard_compact.py --out ../work/scorecard_compact.csv

      - name: Download the finance files for fiscal years 2009-2019
        run: |
          cd src
          python score_v3_test.py prefetch --finance ../work/finance

      - name: Refit classifier v3, the baseline and the anchor sensor on the two-channel development results
        run: |
          cd src
          python reanalysis.py fit --compact ../work/scorecard_compact.csv
          cd ..
          git add "data/v3 reanalysis/classifier.json"
          git commit -m "reanalysis 2: refitted classifier (exploratory)"

      - name: Apply them to the two-channel results of the v3 test institutions
        run: |
          cd src
          python reanalysis.py test --compact ../work/scorecard_compact.csv --finance ../work/finance
          cd ..
          git add "data/v3 reanalysis/test scores/"
          git commit -m "reanalysis 2: two-channel test scores (exploratory)"

      - name: Recompute the measures, verdicts and anchor tests
        run: |
          cd src
          python reanalysis.py results
          cd ..
          git add "data/v3 reanalysis/test outcomes.json" "data/v3 reanalysis/test results.json"
          git commit -m "reanalysis 2: results (exploratory; outcomes already known)"

      - name: Push
        run: |
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase origin/main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep $((20 * attempt))
          done
          exit 1

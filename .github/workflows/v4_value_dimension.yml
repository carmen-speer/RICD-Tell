name: v4 value dimension - 2019 held-out comparison

# Manual-only. Runs "src/v4 value dimension.py" (channel selection protocol,
# Amendments 8, 10 and 11): reads the College Scorecard repayment, default
# and earnings columns from the repository's release asset, joins them to
# the 2019 frame and its outcomes (HD2019 onward), and compares size and
# sector alone with size, sector and the value reading (each OPEID6 counted
# once; campus level as a check). Single held-out comparison, no
# development stage. Commits data/v4 channels/"value dimension 2019.json"
# and "value dimension values.csv".
on:
  workflow_dispatch:

concurrency:
  group: v4-value-dimension
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: |
          pip install -r "requirements v2 lock.txt"
          pip install xlrd==2.0.1

      - name: Run the value-dimension comparison
        run: |
          cd src
          python "v4 value dimension.py"

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/v4 channels/"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "v4: value dimension, 2019 held-out comparison"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

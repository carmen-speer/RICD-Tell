name: v3 phase 2 - list the v3 test institutions

# Manual-only. Runs src/draw_v3_test.py under "sampling protocol v3.md",
# phase 2: lists every institution remaining in the 2019 frame once every
# institution already used is removed. Allowed only after classifier v3 is
# frozen. Commits data/v3/test draw.json and its log. No finance data,
# score or outcome is read.
on:
  workflow_dispatch:

concurrency:
  group: v3-draw
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - name: List
        run: |
          cd src
          python draw_v3_test.py

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/v3/test draw.json" "data/v3/test draw log.csv"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "v3 phase 2: test list (no outcome looked up)"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

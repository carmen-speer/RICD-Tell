name: v2 phase 6 - score the test institutions

# Manual-only. Runs src/score_v2_test.py under "sampling protocol v2.md",
# phase 6: six jobs score test institutions in parallel, each institution
# at seeds 7, 101 and 202 with the frozen pipeline and frozen classifier
# v2, then a final job adds their results to data/v2/test scores/ as the
# next numbered batch and commits it. Run it again until every test
# institution has a result. No test outcome exists or is looked up.
on:
  workflow_dispatch:

concurrency:
  group: v2-test
  cancel-in-progress: false

permissions:
  contents: write

env:
  NUMBA_CPU_NAME: generic
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - name: Build the compact College Scorecard file (checked against the protocol's SHA-256)
        run: |
          cd src
          python build_scorecard_compact.py --out ../work/scorecard_compact.csv

      - name: Download the finance files for fiscal years 2009-2019
        run: |
          cd src
          python score_v2_test.py prefetch --finance ../work/finance

      - name: Score this shard
        run: |
          cd src
          python score_v2_test.py shard --shard ${{ matrix.shard }} --of 6 --minutes 290 --compact ../work/scorecard_compact.csv --finance ../work/finance --out ../work/evals

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: work/evals/
          if-no-files-found: ignore

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - uses: actions/download-artifact@v4
        with:
          path: work/evals
          merge-multiple: true

      - name: Merge the shards into the next batch
        run: |
          cd src
          python score_v2_test.py merge --evals ../work/evals

      - name: Commit the batch
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/v2/test scores/"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "v2 phase 6: test scores batch (no test outcome looked up)"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            echo "Could not push after five tries. The shard results are saved as this run's artifacts; re-run only the merge job."
            exit 1
          fi

name: Diagnose window data (College Scorecard coverage and older finance files)

# Manual-only. Panel only, no model fits. Checks whether the College
# Scorecard API still returns records for the panel's closed
# institutions, how far back each institution's complete Scorecard
# years reach before FY2019, and which older IPEDS finance bulk files
# can be downloaded. See src/diagnose_window_data.py's own docstring.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check College Scorecard coverage and older finance files for the panel
        env:
          COLLEGE_SCORECARD_API_KEY: ${{ secrets.COLLEGE_SCORECARD_API_KEY }}
        run: |
          cd src
          python diagnose_window_data.py

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window_data
          path: reports/window_data/

name: v4 step 0 - check the IPEDS fields for the channel gaps

# Manual-only. Runs "src/v4 field check.py": downloads the IPEDS data
# dictionaries (never the data, never an outcome) for every table the v4
# channel gaps need (published price, net tuition, FTE, income bands, Pell,
# graduation rates and transfer-outs, Outcome Measures, retention, mission
# statements), 2008 to 2024, and records which fields exist in which years,
# as RICD 17.7 requires before anything is built. Commits
# data/v4 channels/field check.json.
on:
  workflow_dispatch:

concurrency:
  group: v4-field-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - name: Check the data dictionaries
        run: |
          cd src
          python "v4 field check.py" --first 2008 --last 2024

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/v4 channels/"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "v4 step 0: field check of the IPEDS dictionaries for the channel gaps (no data, no outcome)"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

name: v2 - early-finance check

# Manual-only. Runs src/check_v2_early_finance.py under "sampling protocol
# v2.md", before phase 2: confirms that every NCES finance file for fiscal
# years 2004-2014 is served and read correctly, and checks the parsed rows
# of the first 20 training institutions for plausibility. Commits
# data/v2/early finance check.json. No outcome is looked up.
on:
  workflow_dispatch:

concurrency:
  group: v2-early-finance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: pip install -r "requirements v2 lock.txt"

      - name: Run the early-finance check
        run: |
          cd src
          python check_v2_early_finance.py --finance ../work/finance

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/v2/early finance check.json"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "v2: early-finance check (no outcome looked up)"
            git fetch origin main
            git rebase origin/main
            git push
          fi

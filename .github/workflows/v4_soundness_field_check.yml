name: v4 soundness field check - the staffing and finance fields

# Manual-only. Runs "src/v4 soundness field check.py": downloads the IPEDS
# data dictionaries (never the data, never an outcome) for the Human
# Resources staffing and new-hire files and the finance forms, 2011 to 2024,
# and records every variable's name and title, so the soundness dimension
# (Spine Definitions 15.2.15 and 15.2.16) is built only from named fields.
# Commits data/v4 channels/"soundness field check.json".
on:
  workflow_dispatch:

concurrency:
  group: v4-soundness-field-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: |
          pip install -r "requirements v2 lock.txt"
          pip install xlrd==2.0.1

      - name: Check the data dictionaries
        run: |
          cd src
          python "v4 soundness field check.py" --first 2011 --last 2024

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/v4 channels/"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "v4: soundness field check of the IPEDS dictionaries (no data, no outcome)"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

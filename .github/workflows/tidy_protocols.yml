name: repo tidy - move protocols into protocols folder

# One-off, manual-only (November 21, 2026). Moves every protocol from the
# top level into protocols/ with its history kept, repoints the links to
# them in the Markdown documents and the dashboard footer
# (src/tidy_protocols.py), and commits the result. No code opens a
# protocol file, so nothing else changes. Safe to leave in place: a second
# run stops at once, because the protocols are no longer at the top level.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Move the protocols and repoint their links
        run: python src/tidy_protocols.py

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "repo tidy: protocols moved into protocols/, links repointed"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi

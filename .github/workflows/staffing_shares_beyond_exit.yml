name: item 14 - staffing shares beyond exit (exploratory)

# Manual-only. Runs "src/staffing shares beyond exit.py" (channel selection
# protocol, Amendment 15): on the 2014 frame (development look) and the
# 2019 frame (check), compares size, sector and staff exit with size,
# sector, exit and each staffing share (secure share; part-time share),
# reading outcomes from the header files. Exploratory: both frames have
# been used before. Commits data/v4 channels/"staffing shares beyond exit.json".
on:
  workflow_dispatch:

concurrency:
  group: staffing-shares-beyond-exit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"

      - name: Install dependencies (pinned)
        run: |
          pip install -r "requirements v2 lock.txt"
          pip install xlrd==2.0.1

      - name: Run the staffing-share comparison
        run: |
          cd src
          python "staffing shares beyond exit.py"

      - name: Commit the result
        run: |
          git config user.name "ricd-tracker-bot"
          git config user.email "actions@github.com"
          git add "data/v4 channels/"
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "item 14: staffing shares beyond exit (exploratory)"
            for attempt in 1 2 3 4 5; do
              if git fetch origin main && git rebase origin/main && git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep $((20 * attempt))
            done
            exit 1
          fi
